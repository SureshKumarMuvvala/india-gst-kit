name: Release

on:
  push:
    branches: [main]

# Serialise releases; never cancel one that is mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

# Workflow-level default is read-only; the release job opts into what it needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch and create tags/releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action pushes the version branch with these credentials.
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # On push to main: if changesets are pending, open/update the
      # "Version Packages" PR. When that PR is merged there are no pending
      # changesets, so the action runs `publish` instead. `changeset publish`
      # skips private packages (and @india-gst-kit/fixtures is also in
      # .changeset/config.json "ignore").
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm exec changeset version
          publish: sh .github/scripts/publish.sh
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
